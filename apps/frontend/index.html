<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PFT — Personal Finance Tracker</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('pft.preferences');
          var theme = null;
          if (raw) {
            var parsed = JSON.parse(raw);
            theme = parsed && parsed.state ? parsed.state.theme : null;
          }
          var resolved =
            theme === 'dark' || theme === 'light'
              ? theme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-mantine-color-scheme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-mantine-color-scheme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
