server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets (Vite emits /assets/<name>-<hash>.<ext>) are immutable —
  # cache aggressively so repeat visits are fast.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html and other entry HTML must never be cached, otherwise the browser
  # keeps loading old hashed asset URLs after a redeploy.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires off;
    try_files $uri =404;
  }

  # Proxy API to backend service in compose network
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
  }

  location ^~ /uploads/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # SPA fallback — for everything else, serve index.html with no caching.
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires off;
    try_files $uri $uri/ /index.html;
  }
}
